[project]
name = "sports-tool"
version = "0.1.0"
description = "Sports data collection and analysis using Python and PostgreSQL"
readme = "README.md"
authors = [
    { name = "Zachary Bailey", email = "zacharyb2504@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.162.0",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.7",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "selenium>=4.52.0",
    "sqlalchemy>=2.1.7",
]

[project.scripts]
sports-tool = "sports_tool:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
